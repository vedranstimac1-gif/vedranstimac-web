# /etc/nginx/sites-available/vedranstimac
server {
    listen 80;
    listen [::]:80;
    server_name vedranstimac.com;
    return 301 https://www.vedranstimac.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.vedranstimac.com;

    root /var/www/vedranstimac-web/site;
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
    location ~ /\.git { deny all; }
    location /media/ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location ~* \.(css|js|svg)$ {
        expires 1d;
    }
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
